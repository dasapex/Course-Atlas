name: Build and deploy Course Atlas

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.148.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      
      - name: Assemble deployable pages
        run: |
          set -euo pipefail

          require_file() {
            if [ ! -s "$1" ]
            then
              echo "Required file is missing or empty: $1"
              exit 1
            fi
          }

          require_file public/index.html
          require_file curriculum-selector.html
          require_file TIP-Course-Atlas.html
          require_file data/course.json
          require_file assets/css/curriculum.css
          require_file assets/js/curriculum.js

          if grep -q '{{' public/index.html
          then
            echo "Unprocessed Hugo template instructions found."
            exit 1
          fi
      
          if ! grep -q -- "--green0" public/index.html
          then
            echo "CSS was not embedded."
            exit 1
          fi
      
          if ! grep -q "CURRICULUM_COURSES" public/index.html
          then
            echo "Curriculum data was not embedded."
            exit 1
          fi

          # Preserve Hugo's rendered FEU application before the selector
          # replaces the deployment root page.
          mv public/index.html public/FEU-Course-Atlas.html

          # Publish each source under one unambiguous deployed filename.
          install -m 0644 curriculum-selector.html public/index.html
          install -m 0644 TIP-Course-Atlas.html public/TIP-Course-Atlas.html
          install -m 0644 data/course.json public/course.json
          install -m 0644 assets/css/curriculum.css public/curriculum.css
          install -m 0644 assets/js/curriculum.js public/curriculum.js

          echo "Deployable pages assembled successfully."

      - name: Validate output
        run: |
          set -euo pipefail

          require_file() {
            if [ ! -s "$1" ]
            then
              echo "Deployment output is missing or empty: $1"
              exit 1
            fi
          }

          require_text() {
            if ! grep -Fq "$2" "$1"
            then
              echo "Expected text was not found in $1: $2"
              exit 1
            fi
          }

          require_file public/index.html
          require_file public/FEU-Course-Atlas.html
          require_file public/TIP-Course-Atlas.html
          require_file public/course.json
          require_file public/curriculum.css
          require_file public/curriculum.js

          require_text public/index.html 'href="FEU-Course-Atlas.html"'
          require_text public/index.html 'href="TIP-Course-Atlas.html"'
          require_text public/FEU-Course-Atlas.html "CURRICULUM_COURSES"
          require_text public/TIP-Course-Atlas.html "course.json"
          require_text public/index.html "This is an unofficial, student-built open-source project"
          require_text public/FEU-Course-Atlas.html "This is an unofficial, student-built open-source project"
          require_text public/TIP-Course-Atlas.html "This is an unofficial, student-built open-source project"

          node -e "const fs=require('fs'); const courses=JSON.parse(fs.readFileSync('public/course.json','utf8')); if(!Array.isArray(courses)||!courses.length) process.exit(1)"
          node -e "const fs=require('fs'); const feu=JSON.parse(fs.readFileSync('data/courses.json','utf8')); const tip=JSON.parse(fs.readFileSync('data/course.json','utf8')); if(feu.length!==76||feu.reduce((n,c)=>n+c.units,0)!==228) throw new Error('Invalid FEU database'); if(tip.length!==72||tip.reduce((n,c)=>n+c.units,0)!==209) throw new Error('Invalid TIP database')"
          node --check public/curriculum.js

          echo "Website validation passed."
          find public -maxdepth 2 -type f -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
