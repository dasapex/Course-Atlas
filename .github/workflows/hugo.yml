# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.2
    steps:
      # ------------------------------------------------------------
      # Source checkout
      # ------------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # Install Hugo Extended
      # ------------------------------------------------------------
      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version
      
      # ------------------------------------------------------------
      # Install the curriculum extractor
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

      # ------------------------------------------------------------
      # Generate Hugo curriculum data
      # ------------------------------------------------------------

      - name: Extract curriculum data
        run: |
          python scripts/extract_curriculum.py

      - name: Validate curriculum data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("data/courses.json")

          if not output.is_file():
              raise SystemExit(
                  "data/courses.json was not generated."
              )

          courses = json.loads(
              output.read_text(encoding="utf-8")
          )

          if not courses:
              raise SystemExit(
                  "data/courses.json contains no courses."
              )

          required_fields = {
              "id",
              "code",
              "name",
              "units",
              "cat",
              "term",
              "prereq",
              "coreq",
          }

          for index, course in enumerate(courses):
              missing = required_fields - course.keys()

              if missing:
                  raise SystemExit(
                      f"Course {index} is missing fields: "
                      f"{sorted(missing)}"
                  )

          total_units = sum(
              course["units"]
              for course in courses
          )

          terms = {
              course["term"]
              for course in courses
          }

          course_ids = {
              course["id"]
              for course in courses
          }

          broken_references = {
              reference
              for course in courses
              for reference in (
                  course["prereq"]
                  + course["coreq"]
              )
              if reference not in course_ids
          }

          if broken_references:
              raise SystemExit(
                  "Broken course references: "
                  + ", ".join(sorted(broken_references))
              )

          if terms != set(range(1, 13)):
              raise SystemExit(
                  f"Expected terms 1–12, found: "
                  f"{sorted(terms)}"
              )

          print(f"Course cards: {len(courses)}")
          print(f"Total units: {total_units}")
          print(f"Terms: {sorted(terms)}")
          print("Curriculum data validation passed.")
          PY

      # ------------------------------------------------------------
      # Configure GitHub Pages
      # ------------------------------------------------------------

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # Build Hugo
      # ------------------------------------------------------------
      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Validate generated website
        run: |
          test -f public/index.html
          test -s public/index.html

          if grep -R \
            -E 'href="/course=atlas/|src="/course=atlas/' \
            public/index.html
          then
            echo "Hardcoded deployment paths were found."
            exit 1
          fi

          echo "Generated website validation passed."
        
      # ------------------------------------------------------------
      # Upload the deployable public directory
      # ------------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
