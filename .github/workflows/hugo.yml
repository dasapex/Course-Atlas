name: Build and deploy Course Atlas

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.148.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Validate output
        run: |
          test -s public/index.html

          if ! grep -q "CURRICULUM_COURSES" public/index.html
          then
            echo "The curriculum database was not embedded in index.html."
            exit 1
          fi

          cp public/index.html public/Course-Atlas.html

          test -s public/Course-Atlas.html

          echo "Website validation passed."
          find public -maxdepth 2 -type f -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
